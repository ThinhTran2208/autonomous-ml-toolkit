name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: checkout-試験
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          path: checkout-試験
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: checkout-試験/pyproject.toml
      - name: Create environment inside the Unicode checkout
        shell: python {0}
        run: |
          import os
          import venv
          from pathlib import Path

          venv.EnvBuilder(with_pip=True).create(".venv")
          scripts = Path(".venv") / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(scripts.resolve()) + "\n")
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build
      - name: Smoke test the installed wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv /tmp/mlexp-wheel
          /tmp/mlexp-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/mlexp-wheel/bin/mlexp run "$GITHUB_WORKSPACE/checkout-試験/examples/iris.yaml"
          /tmp/mlexp-wheel/bin/mlexp compare --experiment iris-baseline
