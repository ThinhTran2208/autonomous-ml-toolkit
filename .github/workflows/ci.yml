name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: checkout-試験
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          path: checkout-試験
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: checkout-試験/pyproject.toml
      - name: Create environment inside the Unicode checkout
        shell: python {0}
        run: |
          import os
          import venv
          from pathlib import Path

          venv.EnvBuilder(with_pip=True).create(".venv")
          scripts = Path(".venv") / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(scripts.resolve()) + "\n")
      - run: python -m pip install -e ".[dev]"
      - name: Verify source, clean wheel, independent acceptance, and CSV smoke tests
        run: python scripts/verify.py
